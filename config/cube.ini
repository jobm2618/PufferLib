[base]
env_name = cube

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 8

[env]
max_steps = 200

[policy]
hidden_size = 512
num_layers = 2
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 1000000000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.1
vf_coef = 1.0
vf_clip_coef = 10.0
max_grad_norm = 1.0
ent_coef = 0.01
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 32768
horizon = 512
vtrace_rho_clip = 2.0
vtrace_c_clip = 2.0
prio_alpha = 0.5
prio_beta0 = 0.5
use_rnn = 1

[sweep]
metric = solve_rate
goal = maximize
